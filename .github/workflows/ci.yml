name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cli:
    name: devin-export (lint + tests)
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e "./cli[dev]"
      - run: ruff check cli
      - run: ruff format --check cli
      - run: pytest cli -q

  dbt:
    name: dbt parse + sqlfluff
    runs-on: ubuntu-latest
    env:
      DBT_PROFILES_DIR: ${{ github.workspace }}/.github
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "dbt-snowflake>=1.8,<2" "sqlfluff>=3.0,<5"
      - run: dbt deps
      - name: dbt parse (all feeds enabled)
        run: dbt parse
      - name: dbt parse (sessions only)
        run: >
          dbt parse --vars '{devin__using_audit_logs: false, devin__using_organizations: false,
          devin__using_org_members: false, devin__using_roles: false}'
      - run: sqlfluff lint models
