[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devin-export"
version = "0.2.0"
description = "Export Devin Enterprise API records (sessions, audit logs, organizations, members, roles) as JSON for warehouse loading"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
dependencies = ["requests>=2.28,<3"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Database",
]

[project.urls]
Homepage = "https://github.com/angellist/dbt_devin"

[project.scripts]
devin-export = "devin_export.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7", "responses>=0.23", "ruff>=0.4"]

[tool.setuptools.packages.find]
include = ["devin_export*"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
