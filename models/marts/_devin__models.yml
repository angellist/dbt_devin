version: 2
models:
  - name: fct_devin_sessions
    description: >
      One row per Devin enterprise session, with tags and created pull
      requests rolled up. `acus_consumed` is the latest captured value for the
      session (semi-additive: summing across sessions is valid, re-summing the
      same session across loads is not). Session counts tie out to
      `stg_devin__sessions`. `session_title` is included only when
      `devin__include_session_title` is true.
    columns:
      - name: session_id
        description: Devin session id (`devin-<uuid>`)
        data_tests:
          - unique
          - not_null
      - name: session_status
        description: new, claimed, running, suspended, exit or error
      - name: session_status_detail
        description: Finer status detail (e.g. blocked, finished)
      - name: created_at
        description: Session creation time (UTC)
      - name: updated_at
        description: Last update time (UTC), as of the latest load
      - name: acus_consumed
        description: ACUs consumed as of the latest load (semi-additive)
      - name: org_id
        description: Devin org the session belongs to
      - name: user_id
        description: Devin user who started the session, null for service-user sessions
      - name: service_user_id
        description: Service user that started the session, null for human sessions
      - name: origin
        description: "webapp, slack, teams, api, linear, jira, automation, cli, desktop, code_scan or other"
      - name: category
        description: Devin-assigned work category
      - name: subcategory
        description: Devin-assigned subcategory
      - name: devin_mode
        description: Agent mode used
      - name: playbook_id
        description: Playbook attached to the session, if any
      - name: automation_id
        description: Automation that created the session, if any
      - name: parent_session_id
        description: Parent session for child sessions
      - name: is_archived
        description: True when archived
      - name: session_url
        description: Link to the session
      - name: created_date
        description: created_at as a date
      - name: created_week
        description: Monday of the week created_at falls in
      - name: created_month
        description: First day of the month created_at falls in
      - name: tag_list
        description: Sorted array of session tags (empty array when none)
      - name: pull_request_count
        description: PRs created by the session (additive)
      - name: merged_pull_request_count
        description: Of those, PRs whose latest captured state is merged (additive)
      - name: is_service_user_session
        description: True when started by a service user rather than a person
      - name: is_child_session
        description: True when spawned by another session
      - name: is_finished
        description: True when `session_status` is in `devin__finished_statuses` (default exit, error; `suspended` is not counted unless added)
      - name: loaded_at
        description: Timestamp of the load this row was taken from

  - name: dim_devin_organizations
    description: >
      One row per Devin organization. `member_count` comes from the latest
      `org_members` export (0 when the org had no members in it; null when the
      feed is disabled).
    columns:
      - name: org_id
        description: Devin org ID
        data_tests:
          - unique
          - not_null
      - name: org_name
        description: Org display name
      - name: member_count
        description: Distinct members of the org in the latest `org_members` export (0 if none)
      - name: members_as_of
        description: Timestamp (`snapshot_at`) of the latest `org_members` export `member_count` was taken from
      - name: loaded_at
        description: Timestamp of the load the org row was taken from

  - name: fct_devin_org_membership_changes
    description: >
      One row per membership change (add or remove) in a Devin org, sourced
      from the enterprise audit log. Factless transaction fact: a row asserts
      that a user was added to or removed from an org, by whom and when.
      Org names, target user attributes and role names are resolved from the
      `organizations`, `org_members` and `roles` feeds when those are enabled.
    columns:
      - name: audit_log_id
        description: Primary key; the audit-log entry recording the change
        data_tests:
          - unique
          - not_null
      - name: changed_at
        description: When the membership change occurred (UTC)
      - name: change_type
        description: "'added' or 'removed'"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['added', 'removed']
      - name: org_id
        description: Devin org the user was added to or removed from
      - name: org_name
        description: Org display name, when resolvable
      - name: target_user_id
        description: Devin user ID of the affected user; null when the audit-log entry omits it
      - name: target_user_email
        description: Affected user's email from their latest-known member snapshot
      - name: target_user_name
        description: Affected user's display name from their latest-known member snapshot
      - name: actor_user_id
        description: User ID of the human who made the change, null for service users
      - name: actor_user_email
        description: Email of the human who made the change
      - name: actor_service_user_id
        description: Service user ID that made the change, null for human actors
      - name: actor_service_user_name
        description: Service user name that made the change, null for human actors
      - name: role_ids
        description: Role IDs assigned by an add (VARIANT array); null on removes
      - name: role_names
        description: Role names for `role_ids` (falls back to the ID when unknown); null on removes

  - name: fct_devin_pull_requests
    description: >
      One row per pull request a Devin session created or updated, flattened
      from `sessions.pull_requests`. The same PR can appear under more than one
      session (e.g. a parent and its child), so the grain is (session, PR URL);
      count distinct `pr_url` for PR-level numbers. `pr_state` is the latest
      captured state. GitHub owner/repo/number are parsed from `pr_url` and
      are null for non-GitHub URLs; join `github_repo_owner`,
      `github_repo_name`, `github_pr_number` to your own GitHub data for review
      and merge-time attribution.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - session_id
              - pr_url
    columns:
      - name: session_pull_request_id
        description: Surrogate key over (session_id, pr_url)
        data_tests:
          - unique
          - not_null
      - name: session_id
        description: Devin session that created or updated the PR
        data_tests:
          - not_null
      - name: pr_url
        description: Pull request URL as reported by Devin
        data_tests:
          - not_null
      - name: pr_state
        description: Latest captured state (e.g. open, merged, closed); null when Devin has not recorded one
      - name: is_merged
        description: True when `pr_state` is merged; false otherwise, including when `pr_state` is null
      - name: github_repo_owner
        description: GitHub owner or org parsed from `pr_url` (null for non-GitHub URLs)
      - name: github_repo_name
        description: GitHub repository name parsed from `pr_url`
      - name: github_pr_number
        description: GitHub PR number parsed from `pr_url`
      - name: org_id
        description: Devin org of the session
      - name: user_id
        description: User who started the session, null for service-user sessions
      - name: service_user_id
        description: Service user that started the session, null for human sessions
      - name: session_origin
        description: Origin of the session (webapp, slack, api, ...)
      - name: session_status
        description: Latest captured status of the session
      - name: session_created_at
        description: When the session was created (UTC)
      - name: session_updated_at
        description: When the session was last updated (UTC)
      - name: loaded_at
        description: Timestamp of the load the session row was taken from

  - name: agg_devin_acu_daily
    description: >
      One row per session creation date, org, user (or service user) and
      origin: a daily rollup of `fct_devin_sessions`. Sessions are attributed
      to the day they were created, so `acus_consumed` is the latest captured
      total for sessions started that day (it grows as running sessions are
      re-captured). Only dates with sessions appear; spine against your date
      dimension for dense dates. Measures are additive and tie out to
      `fct_devin_sessions`. `acu_cost_usd` is included only when the
      `devin_acu_cost_usd` var is set.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - created_date
              - org_id
              - user_id
              - service_user_id
              - origin
    columns:
      - name: created_date
        description: Date the sessions were created (UTC)
        data_tests:
          - not_null
      - name: org_id
        description: Devin org
      - name: user_id
        description: Devin user, null for service-user sessions
      - name: service_user_id
        description: Service user, null for human sessions
      - name: origin
        description: Session origin (webapp, slack, api, ...)
      - name: session_count
        description: Sessions created (additive)
      - name: finished_session_count
        description: Of those, sessions whose latest status is in `devin__finished_statuses` (additive)
      - name: child_session_count
        description: Of those, sessions spawned by another session (additive)
      - name: acus_consumed
        description: Sum of latest-captured ACUs for sessions created that day (additive across rows)
      - name: acu_cost_usd
        description: "`acus_consumed * devin_acu_cost_usd`; present only when the var is set"
      - name: pull_request_count
        description: PRs created by those sessions (additive)
      - name: merged_pull_request_count
        description: Of those, PRs whose latest captured state is merged (additive)
      - name: loaded_at
        description: Latest load timestamp among the rolled-up sessions

  - name: dim_devin_users
    description: >
      One row per Devin user seen either in the latest `org_members` export or
      as the starter of a session. `is_current_member` is false for users who
      have sessions but are absent from the latest export (removed seats);
      their email and name come from their last-known snapshot. Session
      activity measures come from `fct_devin_sessions` and are non-additive
      across users' orgs (a user in two orgs appears once). The 30-day window
      is relative to the time the model is built.
    columns:
      - name: user_id
        description: Devin user ID
        data_tests:
          - unique
          - not_null
      - name: user_email
        description: User email (null when the `org_members` feed is disabled)
      - name: user_full_name
        description: User display name (null when the `org_members` feed is disabled)
      - name: is_current_member
        description: True when the user is in the latest `org_members` export (null when the feed is disabled)
      - name: org_count
        description: Orgs the user belongs to in the latest export (0 when absent)
      - name: org_ids
        description: Sorted array of org IDs the user belongs to in the latest export
      - name: role_names
        description: Sorted distinct role names across the user's current org memberships
      - name: member_as_of
        description: Timestamp (`snapshot_at`) of the export `is_current_member` was taken from
      - name: session_count
        description: Sessions the user has started (all time, as captured)
      - name: session_count_last_30d
        description: Sessions started in the 30 days before the model was built
      - name: acus_consumed
        description: Latest-captured ACUs across the user's sessions
      - name: first_session_at
        description: Creation time of the user's earliest captured session (UTC)
      - name: last_session_at
        description: Creation time of the user's most recent session (UTC)
      - name: is_active_last_30d
        description: True when `session_count_last_30d` > 0

  - name: dim_devin_roles
    description: >
      One row per Devin role (enterprise- or org-scoped).
    columns:
      - name: role_id
        description: Devin role ID
        data_tests:
          - unique
          - not_null
      - name: role_name
        description: Role display name
      - name: role_type
        description: "'enterprise' or 'org'"
      - name: loaded_at
        description: Timestamp of the load the role row was taken from
